name: Build release downloads
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build release packages (verification runs locally before merge)
        run: ./scripts/verify.sh --package-only
      - run: python3 scripts/package-release.py --package-only
      - name: Attach the release library bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" target/adapter-jira-*.zip --repo "$GITHUB_REPOSITORY"
