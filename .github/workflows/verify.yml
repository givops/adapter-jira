name: Verify public Jira adapter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./scripts/verify.sh
      - run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-jira-${{ github.sha }}
          path: target/adapter-jira-*.zip
          if-no-files-found: error
